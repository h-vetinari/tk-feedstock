context:
  version: "9.0.4"
  major: ${{ version | split(".") | first }}
  minor: ${{ (version | split("."))[1] }}
  maj_min: ${{ major }}${{ '.' if unix }}${{ minor }}
  build: 0
  tk_build: ${{ build + 100 if tk_variant == 'noxft' and linux else build }}
  # the variant prefix is only used in the build string on linux
  string_prefix: ${{ (tk_variant | default("")) + "_" if (linux | default(false)) else "" }}

recipe:
  name: tk-split
  version: ${{ version }}

source:
  - url: https://downloads.sourceforge.net/tcl/tcl${{ version }}-src.tar.gz
    target_directory: tcl${{ version }}
    sha256: d0aed49230bc02a65c1e0229e65f34590a4b037ec40d546f32573b467f7551ea
  - url: https://downloads.sourceforge.net/tcl/tk${{ version }}-src.tar.gz
    target_directory: tk${{ version }}
    sha256: d7a146d2917eb8b5cc95276dbf0e3d03c7464d2b19c1675357857c989301dbb4

build:
  number: ${{ build }}
  # TODO: remove this once we build native tk-9
  skip: build_platform != target_platform and win

outputs:
  - staging:
      name: tk-build

    build:
      script:
        file: build
        env:
          PKG_VERSION: ${{ version }}

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - if: unix
          then:
            - make
            - zip
        - if: linux and tk_variant == "xft"
          then: pkg-config
        - if: build_platform != target_platform and win
          then: tcl >=9
      host:
        - if: unix
          then: zlib
        - if: linux
          then:
            - xorg-xorgproto
            - xorg-libx11
        - if: linux and tk_variant == "xft"
          then:
            - xorg-libxft
            - fontconfig
            - expat

  - package:
      name: libtcl

    inherit: tk-build

    build:
      script: install_tcl
      files:
        - include/**
        - lib/**
        - Library/bin/*.dll
        - Library/include/**
        - Library/lib/**

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - if: unix
          then:
            - make
      run_exports:
        # pin to major.minor because library names have that info in them
        - ${{ pin_subpackage('libtcl', upper_bound='x.x') }}
      ignore_run_exports:
        from_package:
          - xorg-libx11
          - xorg-libxft

    tests:
      - package_contents:
          include:
            - tcl.h
            - tclDecls.h
            - tclPlatDecls.h
            - tclTomMathDecls.h
            - tclTomMath.h
          lib:
            - tcl${{ maj_min }}
          files:
            # static and import libraries (not handled by `lib`)
            - if: unix
              then:
                - lib/libtclstub.a
            - if: win
              then:
                - Library/lib/tcl${{ maj_min }}.lib
                - Library/lib/tclstub.lib

  - package:
      name: tcl

    inherit: tk-build

    build:
      script: install_tcl
      files:
        - bin/*
        - Library/bin/*.exe

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - if: unix
          then:
            - make
      run:
        - ${{ pin_subpackage('libtcl', exact=True) }}
      run_exports:
        # pin to major.minor because library names have that info in them
        - ${{ pin_subpackage('tcl', upper_bound='x.x') }}
      ignore_run_exports:
        from_package:
          - xorg-libxft

    tests:
      - package_contents:
          bin:
            - tclsh
            - tclsh${{ maj_min }}

      - script:
          # Check commands work and run a simple program.
          - tclsh hello.tcl
          - tclsh${{ maj_min }} hello.tcl
          - if: win
            then:
              - tclsh${{ maj_min_nodot }} hello.tcl
        requirements:
          run:
            - if: linux
              then: xorg-libx11
        files:
          recipe:
            - hello.tcl

  - package:
      name: libtk

    inherit: tk-build

    build:
      script: install_tk
      files:
        - include/**
        - lib/**
        - Library/bin/*.dll
        - Library/include/**
        - Library/lib/**
      number: ${{ tk_build }}
      string: ${{ string_prefix }}h${{ hash }}_${{ tk_build }}
      variant:
        use_keys:
          - tk_variant
        # deprioritize the xft variant (preserves preference for noxft, replaces v0 track_features)
        down_prioritize_variant: ${{ 1 if (tk_variant | default("")) == "xft" else 0 }}

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - if: unix
          then:
            - make
      run:
        - ${{ pin_subpackage('tcl', upper_bound='x.x.x') }}
      run_exports:
        # pin to major.minor because library names have that info in them
        - ${{ pin_subpackage('libtk', upper_bound='x.x') }}

    tests:
      - package_contents:
          include:
            - tk.h
            - tkDecls.h
            - tkPlatDecls.h
          lib:
            - tcl${{ major }}tk${{ maj_min }}
          files:
            # static and import libraries (not handled by `lib`)
            - if: unix
              then:
                - lib/libtkstub.a
            - if: win
              then:
                - Library/lib/tcl${{ major }}tk${{ maj_min }}.lib
                - Library/lib/tkstub.lib

  - package:
      name: tk

    inherit: tk-build

    build:
      script: install_tk
      files:
        - bin/*
        - Library/bin/*.exe
      number: ${{ tk_build }}
      string: ${{ string_prefix }}h${{ hash }}_${{ tk_build }}
      variant:
        use_keys:
          - tk_variant
        # deprioritize the xft variant (preserves preference for noxft, replaces v0 track_features)
        down_prioritize_variant: ${{ 1 if (tk_variant | default("")) == "xft" else 0 }}

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - if: unix
          then:
            - make
      run:
        - ${{ pin_subpackage('libtk', upper_bound='x.x.x') }}
      run_exports:
        # pin to major.minor because library names have that info in them
        - ${{ pin_subpackage('tk', upper_bound='x.x') }}

    tests:
      - package_contents:
          bin:
            - wish
            - wish${{ maj_min }}
      - script:
          # Check commands work and run a simple program.
          - wish hello.tcl
          - wish${{ maj_min }} hello.tcl
          - if: win
            then:
              - wish${{ maj_min_nodot }} hello.tcl
        files:
          recipe:
            - hello.tcl

about:
  homepage: http://www.tcl.tk/
  license: TCL
  license_file: tcl${{ version }}/license.terms
  summary: A dynamic programming language with GUI support.  Bundles Tcl and Tk.
  repository: https://github.com/tcltk/tk

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - pelson
    - ocefpaf
    - isuruf
    - matthiasdiener
    - xhochy
